spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  seed:
    enabled: false
  queue:
    long-wait-seconds: 600
    large-amount-threshold: 50000
  risk:
    repeat-window-minutes: 60
    repeat-threshold: 3
    transfer-threshold: 2
